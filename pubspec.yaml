name: katalog_genius
description: "Katalog Genius - GPU-powered retail shelf analytics platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # Networking & API
  http: ^1.2.0

  # Image Picking
  image_picker: ^1.1.2

  # Fonts
  google_fonts: ^6.2.1

  # State Management
  provider: ^6.1.2

  # Animations
  flutter_animate: ^4.5.0

  # Secure Storage (ONDC compliance)
  flutter_secure_storage: ^9.2.2

  # Custom painting for bounding boxes
  # (uses built-in Flutter CustomPainter)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
